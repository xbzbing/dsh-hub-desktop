<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH Hub · 实例管理原型</title>
<style>
:root{
  --bg:oklch(0.982 0.003 265);
  --surface:oklch(1 0 0);
  --fg:oklch(0.24 0.02 265);
  --muted:oklch(0.54 0.015 265);
  --border:oklch(0.912 0.008 265);
  --accent:oklch(0.52 0.19 265);
  --accent-ink:oklch(0.99 0.004 265);
  --backdrop:oklch(0.945 0.006 265);
  --idle:oklch(0.66 0.01 265);
  --info:oklch(0.58 0.14 250);
  --warn:oklch(0.70 0.14 78);
  --ok:oklch(0.60 0.14 152);
  --danger:oklch(0.56 0.19 27);

  --accent-soft:color-mix(in oklch, var(--accent) 12%, transparent);
  --fg-soft:color-mix(in oklch, var(--fg) 6%, transparent);
  --hover:color-mix(in oklch, var(--fg) 5%, var(--surface));
  --sel:color-mix(in oklch, var(--fg) 8%, var(--surface));
  --idle-soft:color-mix(in oklch, var(--idle) 14%, var(--surface));
  --info-soft:color-mix(in oklch, var(--info) 14%, var(--surface));
  --warn-soft:color-mix(in oklch, var(--warn) 16%, var(--surface));
  --ok-soft:color-mix(in oklch, var(--ok) 14%, var(--surface));
  --danger-soft:color-mix(in oklch, var(--danger) 13%, var(--surface));
  --idle-ink:color-mix(in oklch, var(--idle) 70%, var(--fg));
  --info-ink:color-mix(in oklch, var(--info) 84%, var(--fg));
  --warn-ink:color-mix(in oklch, var(--warn) 70%, var(--fg));
  --ok-ink:color-mix(in oklch, var(--ok) 84%, var(--fg));
  --danger-ink:color-mix(in oklch, var(--danger) 88%, var(--fg));

  --shadow-1:0 1px 2px rgb(0 0 0 / .05), 0 1px 1px rgb(0 0 0 / .04);
  --shadow-layer:0 10px 24px rgb(0 0 0 / .10), 0 2px 6px rgb(0 0 0 / .06);
  --shadow-pop:0 12px 32px rgb(0 0 0 / .16);
  --shadow-win:0 26px 64px rgb(0 0 0 / .16), 0 4px 14px rgb(0 0 0 / .08);

  --font-display:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-body:var(--font-display);
  --font-mono:ui-monospace, 'SF Mono', Menlo, 'JetBrains Mono', monospace;

  --fs-h1:23px; --fs-h2:19px; --fs-h3:14.5px; --fs-lead:14px; --fs-body:13.5px; --fs-meta:11.5px;
  --gap-xs:6px; --gap-sm:10px; --gap-md:16px; --gap-lg:24px; --gap-xl:40px;
  --radius:8px; --radius-lg:12px; --radius-xl:14px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:oklch(0.185 0.012 265);
  --surface:oklch(0.232 0.014 265);
  --fg:oklch(0.955 0.006 265);
  --muted:oklch(0.70 0.015 265);
  --border:oklch(0.325 0.015 265);
  --accent:oklch(0.66 0.17 265);
  --accent-ink:oklch(0.17 0.02 265);
  --backdrop:oklch(0.135 0.01 265);
  --idle:oklch(0.62 0.012 265);
  --info:oklch(0.70 0.14 250);
  --warn:oklch(0.80 0.14 82);
  --ok:oklch(0.74 0.15 152);
  --danger:oklch(0.68 0.18 27);
  --shadow-1:0 1px 2px rgb(0 0 0 / .4);
  --shadow-layer:0 14px 34px rgb(0 0 0 / .5);
  --shadow-pop:0 16px 40px rgb(0 0 0 / .55);
  --shadow-win:0 30px 70px rgb(0 0 0 / .6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--backdrop);color:var(--fg);
  font-family:var(--font-body);font-size:var(--fs-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;flex-direction:column;overflow:hidden;
}
img,svg{display:block}svg{flex:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
p{margin:0;text-wrap:pretty}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
.container{max-width:1120px;margin-inline:auto;padding-inline:24px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--gap-sm)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--gap-sm)}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap-lg)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap-md)}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap-md)}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:var(--gap-lg);align-items:start}
.grid-1-2{display:grid;grid-template-columns:1fr 2fr;gap:var(--gap-lg);align-items:start}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
h1,.h1{font-size:var(--fs-h1);line-height:1.2;letter-spacing:-.02em;font-weight:600}
h2,.h2{font-size:var(--fs-h2);line-height:1.25;letter-spacing:-.015em;font-weight:600}
h3,.h3{font-size:var(--fs-h3);line-height:1.35;font-weight:600}
.lead{font-size:var(--fs-lead);color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--muted)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--fg-soft);color:var(--muted);font-family:var(--font-mono);font-size:11px;letter-spacing:.03em}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--border);border-radius:999px;font-size:11.5px;color:var(--muted)}
.rule{border:0;border-top:1px solid var(--border);margin:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid var(--border);border-radius:6px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.03em;color:var(--muted);background:var(--surface);white-space:nowrap}
.badge svg{width:11px;height:11px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip svg{width:12px;height:12px}
.c-idle{background:var(--idle-soft);color:var(--idle-ink)}
.c-info{background:var(--info-soft);color:var(--info-ink)}
.c-warn{background:var(--warn-soft);color:var(--warn-ink)}
.c-ok{background:var(--ok-soft);color:var(--ok-ink)}
.c-err{background:var(--danger-soft);color:var(--danger-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;transition:background .15s ease,border-color .15s ease,color .15s ease;min-height:31px}
.btn svg{width:14px;height:14px}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:color-mix(in oklch, var(--accent) 86%, var(--fg));color:var(--accent-ink)}
.btn-primary:disabled{background:var(--fg-soft);color:var(--muted);cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--fg);border-color:var(--border)}
.btn-secondary:hover{background:var(--hover);border-color:color-mix(in oklch, var(--fg) 28%, var(--border))}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:var(--hover);color:var(--fg)}
.btn-danger{background:var(--danger);color:oklch(0.99 0.005 27)}
.btn-danger:hover{background:color-mix(in oklch, var(--danger) 86%, black)}
.btn-danger:disabled{background:var(--fg-soft);color:var(--muted);cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{padding:5px 10px;font-size:12px;min-height:27px}
.btn-arrow::after{content:'→'}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.card-flat{background:transparent;border:0;padding:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px}
.card-head h3{font-size:13.5px;font-weight:600}
.feature .feature-mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--border);border-radius:9px;color:var(--muted);margin-bottom:12px}
.stat .stat-num{font-family:var(--font-display);font-size:30px;line-height:1;letter-spacing:-.03em;font-weight:600}
.stat .stat-label{color:var(--muted);font-size:12px;margin-top:6px}
.quote{font-size:20px;line-height:1.4}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:12px;color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--muted)}
.input,.textarea,.select{width:100%;padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px;min-height:32px}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
.input:hover,.select:hover{border-color:color-mix(in oklch, var(--fg) 22%, var(--border))}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.textarea{min-height:72px;resize:vertical;line-height:1.55}
.err{font-size:11.5px;color:var(--danger-ink);display:flex;align-items:center;gap:4px}
.ds-table{width:100%;border-collapse:collapse;font-size:12.5px}
.ds-table th,.ds-table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
.ds-table th{color:var(--muted);font-weight:500;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.ds-table tbody tr:hover{background:var(--hover)}
.ds-table tbody tr:last-child td{border-bottom:0}
.num-col{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.content-img{display:block;max-width:100%;max-height:min(70vh,720px);width:auto;height:auto;object-fit:contain;border-radius:var(--radius-lg)}

/* menubar + window */
.menubar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12.5px;background:color-mix(in oklch, var(--surface) 65%, transparent);backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--border);z-index:30}
.mb-left,.mb-right{display:flex;align-items:center;gap:2px}
.mb-app{padding:2px 9px;border-radius:6px;font-weight:600}
.mb-menu{padding:2px 9px;border-radius:6px;color:var(--muted)}
.mb-menu:hover,.mb-app:hover{background:var(--hover);color:var(--fg)}
.mb-tray{position:relative;display:grid;place-items:center;width:26px;height:22px;border-radius:6px;color:var(--muted)}
.mb-tray:hover{background:var(--hover);color:var(--fg)}
.mb-tray i{position:absolute;right:3px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 1.5px color-mix(in oklch, var(--bg) 80%, transparent)}
.mb-clock{padding:2px 9px;color:var(--muted)}
.window{flex:1;min-height:0;margin:9px 11px 11px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-win);overflow:hidden}
.win-body{height:100%;display:grid;grid-template-columns:262px 1fr}

/* sidebar */
.sidebar{display:flex;flex-direction:column;min-height:0;background:color-mix(in oklch, var(--bg) 62%, var(--surface));border-right:1px solid var(--border)}
.traffic{display:flex;gap:8px}
.traffic i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 -1px 1px rgb(0 0 0 / .18)}
.t-r{background:oklch(0.69 0.19 27)}
.t-y{background:oklch(0.82 0.16 85)}
.t-g{background:oklch(0.72 0.16 145)}
.brand{display:flex;align-items:center;gap:9px;padding:12px 12px 10px;border-radius:10px;width:100%;text-align:left}
.brand:hover{background:var(--hover)}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px}
.brand b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.brand em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.side-tools{padding:0 12px 8px;display:grid;gap:8px}
.search{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:13px;height:13px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:12.5px;color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--fg-soft);border:1px solid var(--border);border-radius:9px}
.seg button{padding:4px 9px;border-radius:7px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow-1)}
.side-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 12px}
.group-head{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 5px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.inst{position:relative;display:grid;grid-template-columns:8px 1fr auto;gap:9px;align-items:center;width:100%;padding:7px 9px;border:1px solid transparent;border-radius:9px;text-align:left}
.inst:hover{background:var(--hover)}
.inst[aria-current="true"]{background:var(--sel);border-color:var(--border)}
.inst[aria-current="true"]::before{content:'';position:absolute;left:-1px;top:8px;bottom:8px;width:2.5px;border-radius:2px;background:var(--accent)}
.inst-text{display:block;min-width:0}
.inst-name{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst-meta{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--idle);box-shadow:0 0 0 3px color-mix(in oklch, var(--idle) 16%, transparent)}
.s-connecting{background:var(--info);box-shadow:0 0 0 3px color-mix(in oklch, var(--info) 16%, transparent);animation:pulse 1.4s ease-in-out infinite}
.s-auth,.s-locked,.s-interrupted{background:var(--warn);box-shadow:0 0 0 3px color-mix(in oklch, var(--warn) 18%, transparent)}
.s-connected{background:var(--ok);box-shadow:0 0 0 3px color-mix(in oklch, var(--ok) 16%, transparent)}
.s-error{background:var(--danger);box-shadow:0 0 0 3px color-mix(in oklch, var(--danger) 16%, transparent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.side-foot{flex:none;padding:10px 12px 12px;border-top:1px solid var(--border);display:grid;gap:7px}
.side-foot .row{gap:6px}
.side-foot .row .btn{flex:1}
.icon-btn{width:31px;padding:0;flex:none!important}

/* sidebar collapse */
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 10px 0 14px}
.collapse-btn{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:7px;color:var(--muted)}
.collapse-btn:hover{background:var(--hover);color:var(--fg)}
.collapse-btn svg{width:15px;height:15px}
.fx-icon,.rail-btn{display:none}
@media (min-width:921px){
  .win-body{transition:grid-template-columns .2s ease}
  .win-body.rail{grid-template-columns:64px 1fr}
  .win-body.rail .side-head{flex-direction:column;justify-content:center;gap:8px;padding:11px 0 0}
  .win-body.rail .traffic{gap:5px}
  .win-body.rail .traffic i{width:10px;height:10px}
  .win-body.rail .brand{flex-direction:column;gap:0;padding:9px 0}
  .win-body.rail .brand-text{display:none}
  .win-body.rail .side-tools{display:none}
  .win-body.rail .rail-btn{display:grid;place-items:center;align-self:center;width:46px;height:30px;margin:6px 0 2px;border-radius:8px;color:var(--muted)}
  .win-body.rail .rail-btn:hover{background:var(--hover);color:var(--fg)}
  .win-body.rail .side-scroll{padding:2px 0 12px}
  .win-body.rail .group-head{justify-content:center;padding:10px 0 4px}
  .win-body.rail .group-head span:first-child{display:none}
  .win-body.rail .inst{grid-template-columns:1fr;justify-items:center;gap:0;padding:9px 0}
  .win-body.rail .inst-text{display:none}
  .win-body.rail .inst .badge{border:0;background:none;padding:0;color:var(--muted);gap:0}
  .win-body.rail .inst .type-label{display:none}
  .win-body.rail .inst .badge svg{width:17px;height:17px}
  .win-body.rail .inst:hover .badge,.win-body.rail .inst[aria-current="true"] .badge{color:var(--fg)}
  .win-body.rail .inst .status-dot{position:absolute;right:13px;top:5px;width:7px;height:7px;box-shadow:0 0 0 2px color-mix(in oklch, var(--bg) 62%, var(--surface))}
  .win-body.rail .inst[aria-current="true"]::before{left:1px;top:6px;bottom:6px}
  .win-body.rail .side-foot{padding:10px 8px 12px;gap:6px}
  .win-body.rail .side-foot .row{display:grid;grid-template-columns:1fr;gap:6px}
  .win-body.rail .side-foot .btn{width:100%;padding:0;min-height:32px}
  .win-body.rail .fx-label{display:none}
  .win-body.rail .fx-icon{display:grid;place-items:center}
}

/* content */
.content{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{flex:none;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 16px;border-bottom:1px solid var(--border)}
.tb-left,.tb-right{display:flex;align-items:center;gap:9px;min-width:0}
.tb-title{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.tb-sub{font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}
.content-scroll{flex:1;min-height:0;overflow-y:auto;padding:18px 18px 28px}
.content-scroll.flush{padding:0;display:flex;flex-direction:column}
.page-head{display:flex;flex-direction:column;gap:6px}
.banner{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:12.5px;background:var(--warn-soft);color:var(--warn-ink);border-bottom:1px solid color-mix(in oklch, var(--warn) 30%, var(--border))}
.banner svg{width:14px;height:14px}
.banner .spacer{flex:1}
.progress-line{height:2px;background:var(--border);overflow:hidden;flex:none}
.progress-line i{display:block;height:100%;width:38%;background:var(--accent);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd.num{font-family:var(--font-mono)}
.tl-item{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:12.5px}
.tl-item:first-child{border-top:0}
.tl-item time{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.empty{max-width:400px;margin:52px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty .glyph{color:var(--muted);opacity:.5}
.empty .glyph svg{width:76px;height:76px}
.empty h2{color:var(--fg)}
.menu-pop{position:fixed;top:34px;right:11px;width:258px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;z-index:70;font-size:13px}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:7px;text-align:left;color:var(--fg)}
.menu-item svg{width:14px;height:14px;color:var(--muted)}
.menu-item:hover{background:var(--hover)}
.menu-item:disabled{color:var(--muted);cursor:not-allowed}
.menu-item:disabled svg{opacity:.5}
.menu-sep{border-top:1px solid var(--border);margin:5px 4px}

function stepperHtml(step){
  var names=['选择连接方式','传输配置','认证与确认'];

    var k=i+1,cls=k===step?'step on':(k<step?'step done':'step');
    return (i?'<span class="step-line"></span>':'')+'<span class="'+cls+'"><b>'+(k<step?'✓':k)+'</b>'+n+'</span>';
  }).join('')+'</div>';

function startConnect(it){
  it.status='connecting';it.needsAuth=it.needsAuth||false;render();

    if(it.needsAuth){it.status='auth';render();auth.open=true;auth.id=it.id;auth.step='pw';auth.error='';auth.attempts=0;renderLayer();focusFirst();}
    else{it.status='connected';it.since=Date.now();render();openWorkspace(it.id);toast('ok','连接成功',it.name+' 已就绪');simulate(it);}

function simulate(it){
  if(it.type==='ssh'&&!it._recon){
    it._recon=true;
    later(function(){
      if(it.status!=='connected')return;
      it.status='interrupted';it.retry=1;render();
      later(function(){
        if(it.status!=='interrupted')return;
        it.status='connected';render();
        toast('ok','通道已恢复','自动重连成功,工作区已继续');
        it.audit.unshift(['刚刚','通道断开后自动重连成功']);
      },2600);
    },4200);
  }
  if(it.type==='remote'&&!it._expired){
    it._expired=true;
    later(function(){
      if(it.status!=='connected')return;
      it.status='auth';it.needsAuth=false;render();
      toast('warn','登录已过期','重新登录后即可继续工作');
      it.audit.unshift(['刚刚','会话过期,需要重新登录']);
    },9000);
  }
}
function connectRequest(id){
  var it=get(id);if(!it)return;

  if(it.fpChanged){fp={id:id,mode:'changed',host:it.addr,fingerprint:'SHA256:Zx10pp…Mn77',real:it.fingerprint};renderLayer();focusFirst();return;}

document.addEventListener('keydown',function(e){
  var boxes=$$('.otp input');
  if(boxes.indexOf(document.activeElement)>-1){
    if(e.key==='Backspace'&&!document.activeElement.value){
      var i=boxes.indexOf(document.activeElement);if(i>0)boxes[i-1].focus();
    }
    if(e.key==='ArrowLeft'&&boxes.indexOf(document.activeElement)>0)boxes[boxes.indexOf(document.activeElement)-1].focus();
    if(e.key==='ArrowRight'&&boxes.indexOf(document.activeElement)<boxes.length-1)boxes[boxes.indexOf(document.activeElement)+1].focus();
  }
  if(e.key==='Enter'){
    if(auth.open&&!auth.busy&&auth.lockedUntil<=Date.now()){e.preventDefault();handleAct('auth-submit');return;}
    if(wiz.open){e.preventDefault();handleAct(wiz.step<3?'wiz-next':'wiz-create');return;}
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'){e.preventDefault();toggleRail();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openWizard();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){if(auth.open){e.preventDefault();handleAct('auth-submit');}return;}
  if(e.key==='Escape'){
    if(confirmDlg){confirmDlg=null;renderLayer();return;}
    if(fp){fp=null;renderLayer();return;}
    if(onboard){onboard=null;renderLayer();return;}
    if(auth.open&&!auth.busy){closeAuth();return;}
    if(wiz.open){wiz.open=false;renderLayer();return;}
    if(trayOpen){trayOpen=false;renderLayer();return;}
    if(menu){menu=null;renderLayer();}
  }
});

function handleAct(act,node){

  if(act==='clear-session'){var c=get(S.sel);if(c){c.needsAuth=Boolean(c.twofa);c.status=c.status==='connected'?'idle':c.status;c.since=null;render();toast('ok','已清除登录信息',c.name+' 下次进入需要重新认证');}return;}
  if(act==='clear-all'){confirmDlg={title:'清除所有已保存的登录信息',body:'所有实例都会回到「未登录」,下次进入时需要重新输入密码与验证码。远端 dsh 不受影响。',ok:'全部清除',danger:true,foot:'强确认操作',onOk:function(){instances.forEach(function(i){i.needsAuth=Boolean(i.twofa);if(i.status==='connected'){i.status='idle';i.since=null;}});toast('ok','已清除全部登录信息','共 '+instances.length+' 个实例已回到未登录');}};renderLayer();return;}
  if(act==='clear-inst'){confirmDlg={title:'清除全部实例',body:'本机保存的实例、连接记录与登录信息都会被删除,且不可撤销。远端 dsh 不受影响。',ok:'删除全部',danger:true,foot:'不可撤销',onOk:function(){instances=[];S.sel=null;S.view='home';toast('ok','已清除全部实例');}};renderLayer();return;}
  if(act==='delete'){menu=null;var d=get(S.sel);if(d){confirmDlg={title:'删除实例',body:'删除后本地保存的登录信息与连接记录会一并移除,远端 dsh 本身不受影响。',ok:'删除实例',danger:true,requireText:d.name,foot:'不可撤销',onOk:function(){instances=instances.filter(function(i){return i.id!==d.id;});S.sel=instances.length?(instances[0].id):null;S.view=instances.length?'home':'home';toast('ok','已删除实例',d.name);}};renderLayer();focusFirst();}return;}
  if(act==='edit'){menu=null;renderLayer();openWizard();toast('info','编辑实例','原型中编辑复用创建向导表单');return;}
  if(act==='copy'||act==='copy-fp'){
    menu=null;var v=act==='copy-fp'?(fp?fp.fingerprint:''):(get(S.sel)?get(S.sel).addr:'');
    try{if(navigator.clipboard)navigator.clipboard.writeText(v);}catch(err){}
    toast('ok','已复制',v);if(menu===null)renderLayer();return;}
  if(act==='log'){toast('info','审计日志','已在本机打开日志目录');return;}
  if(act==='open-dir'){toast('info','已打开数据目录','~/Library/Application Support/DSH Hub');return;}
  if(act==='update'){toast('info','检查更新','当前已是最新版本 0.9.4');return;}

  if(act==='newwin'){toast('info','已在新窗口打开','该窗口与本窗口共享登录状态');return;}
  if(act==='fp-cancel'){fp=null;var f1=get(S.sel);if(f1&&f1.status==='connecting')f1.status='idle';renderLayer();render();return;}
  if(act==='fp-accept'){
    var f=get(fp.id);var mode=fp.mode;
    if(f){f.trusted=true;if(mode==='changed'){f.fpChanged=false;f.fingerprint='SHA256:Zx10pp…Mn77';f.audit.unshift(['刚刚','指纹已重新确认 · 高级操作']);toast('warn','已按高级流程信任','指纹变化已记录到审计');}else{f.audit.unshift(['刚刚','指纹已确认 · 写入 known_hosts']);}}

  if(act==='c-ok'){var fn=confirmDlg.onOk;confirmDlg=null;renderLayer();if(fn)fn();render();return;}

function handleTray(kind){

  if(kind==='notify'){toast('info','系统通知已切换','可在设置中重新开启');return;}

    var running=instances.filter(function(i){return i.status==='connected'||i.status==='connecting'||i.status==='interrupted';});

    confirmDlg={title:'退出 DSH Hub',body:'以下实例仍在运行,退出会一并断开它们的连接。',list:running,ok:'退出并断开 '+running.length+' 个实例',danger:true,foot:'可重新启动后恢复',
      onOk:function(){running.forEach(function(i){i.status='idle';i.since=null;});toast('ok','已退出','共断开 '+running.length+' 个实例');}};
    renderLayer();return;
  }

    wiz.data={name:name,host:host,user:user,port:Number(port)};

function authSubmit(){
  if(auth.busy||auth.lockedUntil>Date.now())return;
  var it=get(auth.id);if(!it)return;
  if(auth.step==='pw'){
    var pw=$('#aPw')?$('#aPw').value:'';
    if(!pw){$('#aPw').setAttribute('aria-invalid','true');$('#aPw').focus();auth.error='请输入密码';renderLayer();focusFirst();return;}
    auth.remember=$('#aRemember')?$('#aRemember').checked:false;
    auth.busy=true;auth.error='';renderLayer();
    later(function(){
      auth.busy=false;
      if(it.twofa){auth.step='otp';renderLayer();focusFirst();}
      else{authSuccess(it);}
    },700);
    return;
  }
  var code='';
  if(auth.step==='otp'){code=$$('.otp input').map(function(b){return b.value||'';}).join('');}
  else{code=($('#aBackup')?$('#aBackup').value:'').replace(/\D/g,'');}
  if(auth.step==='otp'&&code.length<6){auth.error='请输入完整的 6 位验证码';renderLayer();focusFirst();return;}
  if(auth.step==='backup'&&code.length<8){auth.error='请输入完整的 8 位备份码';renderLayer();focusFirst();return;}
  auth.busy=true;auth.error='';renderLayer();
  later(function(){
    auth.busy=false;
    var bad=(auth.step==='otp'&&code==='000000');
    if(bad){
      auth.attempts++;
      if(auth.attempts>=5){
        auth.lockedUntil=Date.now()+5*60*1000;
        auth.error='';
        it.audit.unshift(['刚刚','登录失败 5 次 · 触发 5 分钟锁定']);
        toast('err','登录已锁定','尝试次数过多,5 分钟后自动恢复');
      }else{
        auth.error='账号或验证码错误,请重试(还剩 '+(5-auth.attempts)+' 次机会)';
        it.audit.unshift(['刚刚','登录失败 · 凭据不匹配']);
      }
      renderLayer();focusFirst();
      return;
    }
    authSuccess(it);
  },750);
}
function authSuccess(it){
  auth.step='done';auth.error='';renderLayer();
  it.needsAuth=false;it.status='connected';it.since=Date.now();
  it.audit.unshift(['刚刚','登录成功 · 会话有效 30 天']);
  later(function(){
    closeAuth();
    if(it.initialPw){onboard={id:it.id};renderLayer();focusFirst();return;}
    openWorkspace(it.id);
    toast('ok','登录成功',it.name+' · 会话 30 天内不再打扰');
    simulate(it);
  },760);
}
function onboardSave(){
  var n=$('#oNew'),n2=$('#oNew2'),e=$('#oErr');
  var v=n.value,v2=n2.value;
  var bad='';
  if(v.length<8)bad='新密码至少 8 位';
  else if(!(/[A-Z]/.test(v)||/[^A-Za-z0-9]/.test(v)))bad='需包含大写字母或特殊字符';
  else if(v!==v2)bad='两次输入的新密码不一致';
  if(bad){e.innerHTML='<div class="note n-err mt12" role="alert">'+ICON.alert+'<span>'+bad+'</span></div>';renderLayer();$('#oNew').value=v;$('#oNew2').value=v2;return;}
  var it=get(onboard.id);onboard=null;renderLayer();
  if(it){it.initialPw=false;it.status='connected';it.since=Date.now();it.audit.unshift(['刚刚','已设置个人密码 · 初始密码失效']);openWorkspace(it.id);toast('ok','密码已更新','已使用新密码登录 '+it.name);simulate(it);}
}
function tick(){
  var d=new Date();
  $('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $$('[data-uptime]').forEach(function(n){var it=get(n.dataset.uptime);if(it&&it.since)n.textContent=fmtDur(Date.now()-it.since);});
  var l=$('[data-lock]');
  if(l&&auth.lockedUntil>Date.now())l.textContent=mmss(auth.lockedUntil-Date.now());
  if(auth.open&&auth.lockedUntil&&auth.lockedUntil<=Date.now()){
    auth.lockedUntil=0;auth.attempts=0;auth.step='pw';auth.error='';
    renderLayer();focusFirst();toast('info','锁定已解除','可以重新登录了');
  }
  if(S.view==='detail'||S.view==='home'){
    $$('[data-dur]').forEach(function(n){var it=get(n.dataset.dur);if(it&&it.since)n.textContent=fmtDur(Date.now()-it.since);});
  }
}
function boot(){
  $('#searchIcon').innerHTML=ICON.search;
  $('#brandMark').innerHTML=ICON.hub;
  $('#trayIcon').innerHTML=ICON.tray;
  $('#railSearchIcon').innerHTML=ICON.search;
  $('#newIcon').innerHTML=ICON.plus;
  $('#setIcon').innerHTML=ICON.gear;
  try{
    S.mode=localStorage.getItem('dshhub.theme')||'system';
    S.group=localStorage.getItem('dshhub.group')||'mixed';
    S.rail=localStorage.getItem('dshhub.rail')==='1';
  }catch(e){S.mode='system';}
  applyTheme();applyRail();
  if(window.matchMedia('(prefers-color-scheme: dark)').addEventListener){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.mode==='system'){applyTheme();render();}});
  }
  seed();
  S.sel=instances[0].id;S.view='home';
  render();tick();
  setInterval(tick,1000);
  later(function(){toast('info','实例列表已就绪',instances.length+' 个实例,其中 1 个已连接');},900);
}
$('#trayBtn').addEventListener('click',function(e){e.stopPropagation();trayOpen=!trayOpen;renderLayer();});
$('#brandBtn').addEventListener('click',function(){S.view='home';render();});
$('#collapseBtn').addEventListener('click',function(){toggleRail();});
$('#railSearchBtn').addEventListener('click',function(){
  toggleRail(false);
  setTimeout(function(){var i=$('#q');if(i)i.focus();},210);
});
$('#newBtn').addEventListener('click',openWizard);
$('#settingsBtn').addEventListener('click',function(){S.view='settings';render();});
$('#themeBtn').addEventListener('click',function(){S.mode=S.theme==='dark'?'light':'dark';applyTheme();persist();render();});
boot();
</script>
</body>
</html>
