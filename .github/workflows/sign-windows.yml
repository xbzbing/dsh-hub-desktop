# 在 Windows 官方 runner 上构建未签名的 NSIS 安装包,提交给 SignPath 签名并取回。
# 依赖 SignPath 后台(Open Source Code Signing edition)已完成下述配置:
#   - Trusted Build System: GitHub.com + SignPath GitHub App
#   - Project: dsh-hub-desktop(repository URL 指向本仓库)
#   - Signing Policy: release-signing(Purpose=release, 开启 trusted build + origin
#     verification, allowed branches 含 main, 手动审批)
#   - Artifact Configuration: 单文件 exe,Authenticode + SHA256 时间戳
# 仓库 secrets: SIGNPATH_API_TOKEN(CI user), SIGNPATH_ORGANIZATION_ID。
name: sign-windows

on:
  # 申请通过前只用手动触发;经 SignPath 验收后再按需放开 `push: tags: ['v*']`
  workflow_dispatch:
    inputs:
      ref:
        description: '要签名的 ref(tag 或 commit),如 v0.1.3'
        required: true
        default: 'main'

# public 仓库默认权限已够用;显式声明便于审计
permissions:
  actions: read
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dist:win 含 electron:prepare + bundle:npm + build + electron-builder --win
      # 未配置任何签名证书,产物为未签名安装器,交由 SignPath 后签
      - name: Build unsigned Windows installer
        env:
          CI: 'true'
        run: pnpm dist:win
      # 未签名产物必须先存为 GitHub workflow artifact,SignPath 才可做 origin verification
      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist/DSH-Hub-Setup-*.exe
          archive: false
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: dsh-hub-desktop
          signing-policy-slug: release-signing
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          Get-ChildItem signed -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            [PSCustomObject]@{
              File = $_.Name
              Status = $sig.Status
              Signer = $sig.SignerCertificate.Subject
            }
          } | Format-Table -AutoSize
      - name: Upload signed installer
        uses: actions/upload-artifact@v7
        with:
          name: signed-installer
          path: signed/
          retention-days: 7