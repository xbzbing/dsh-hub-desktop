name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Electron E2E 需要显示服务;Linux CI 无显示器,用 xvfb 虚拟屏(R4)。
      # safeStorage 依赖 Secret Service(dbus + gnome-keyring);缺失时凭据保险库
      # 降级为纯内存,与真实 Linux 桌面行为不一致,跨重启的用例会失败。
      - run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
      - name: Run E2E
        env:
          # 无头环境无法点击下载确认原生对话框;本地实例启动按拒绝处理,快速到达确定终态
          DSH_HUB_E2E_DECLINE_DOWNLOAD: '1'
        run: |
          dbus-run-session -- sh -c '
            eval "$(echo -n "" | gnome-keyring-daemon --unlock --components=secrets)"
            xvfb-run -a pnpm test:e2e
          '
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            hub-data/ui-polish-shots/
          if-no-files-found: ignore
          retention-days: 7

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xbzbing/dsh-auth-gateway
          path: dsh-auth-gateway
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract
        env:
          DSH_AUTH_GATEWAY_SRC: ${{ github.workspace }}/dsh-auth-gateway