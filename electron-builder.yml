# 本地打包配置。公开发布策略见 docs/release-policy.md。
appId: dev.dshhub.desktop
productName: DSH Hub
# `electron` 已随 devDependencies 安装。复用其解压分发包可避免 builder 在每次
# macOS 打包时额外访问 GitHub；离线或网络抖动环境仍可稳定出包。
electronDist: node_modules/electron/dist
directories:
  buildResources: build
  output: dist
# 本地构建仍会生成更新元数据；它们仅供本机验证与将来的已签名发布使用，
# 不是当前 GitHub source-only Release 的资产。
generateUpdatesFilesForAllChannels: false
# 只随包 out/ 与 package.json;源码、测试、docs 不入包
files:
  - out/**
  - package.json
extraResources:
  # trayIconPath() 优先读 process.resourcesPath/<name>
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
mac:
  icon: build/icon.icns
  # Native Chromium/Electron resource locales only. App UI translations remain zh/en in app.asar.
  electronLanguages:
    - en
    - zh_CN
    - zh_TW
  category: public.app-category.developer-tools
  # 默认仅输出解包的 .app，避免本地验证额外生成 dmg / zip。
  target:
    - dir
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
